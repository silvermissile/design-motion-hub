<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Motion Recipes Kit — Showcase</title>
  <link rel="stylesheet" href="../assets/effects/like-burst/like-burst.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color: #f6f7fb; background: #0c0d14; }
    .hero { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 48px 24px; overflow: hidden; }
    .silk { position: absolute; inset: 0; z-index: 0; }
    .scrim { position: absolute; inset: 0; z-index: 1; background: radial-gradient(circle at center, rgba(12,13,20,0.45), rgba(12,13,20,0.88)); }
    .card { position: relative; z-index: 2; max-width: 680px; text-align: center; padding: 40px 32px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.14); background: rgba(15,17,26,0.58); backdrop-filter: blur(12px); }
    .eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #c4b5fd; margin-bottom: 12px; }
    h1 { font-size: clamp(28px, 5vw, 48px); line-height: 1.12; margin: 0 0 14px; }
    p { color: #cbd5e1; margin: 0 0 24px; line-height: 1.6; }
    .actions { display: flex; gap: 12px; justify-content: center; align-items: center; }
    .like-btn { border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; padding: 10px 18px; border-radius: 999px; cursor: pointer; font-size: 15px; }
    .like-btn.is-liked { border-color: #ff4d6d; color: #ff4d6d; }
  </style>
</head>
<body>
  <section class="hero">
    <div class="silk" data-fallback="#12101d"></div>
    <div class="scrim"></div>
    <div class="card">
      <div class="eyebrow">design-motion-hub · 84 zero-dependency effects</div>
      <h1 class="decrypt">Anything becomes motion, cleanly.</h1>
      <p>WebGL silk shader (with HyperFrames dual-clock support), hover-triggered kinetic text, and user-earned particle delight.</p>
      <div class="actions">
        <button class="like-btn" data-like-burst aria-pressed="false">♥ Like Moment</button>
      </div>
    </div>
  </section>
  <script src="../assets/shaderbg.js"></script>
  <script src="../assets/effects/silk/silk.js"></script>
  <script src="../assets/effects/decrypted-text/decrypted-text.js"></script>
  <script src="../assets/effects/like-burst/like-burst.js"></script>
</body>
</html>
